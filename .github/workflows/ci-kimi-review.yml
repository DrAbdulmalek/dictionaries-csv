name: CI — dictionaries-csv

on:
  push:
    branches: [main, develop]
    paths:
      - 'scripts/**'
      - 'csv/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'scripts/**'
      - 'csv/**'
      - 'tests/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff mypy
          pip install beautifulsoup4 lxml pdfplumber python-docx
          pip install readmdict
          # Optional: install tesseract for OCR tests
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng

      - name: Lint with ruff
        run: ruff check scripts/ --output-format=github || true

      - name: Type check with mypy
        run: mypy scripts/ --ignore-missing-imports || true

      - name: Run tests
        run: pytest tests/ -v --cov=scripts --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Validate CSV files
        run: |
          python -c "
          import csv
          from pathlib import Path
          errors = []
          warnings = []
          for csv_file in Path('csv').glob('*.csv'):
              try:
                  with open(csv_file, encoding='utf-8-sig') as f:
                      reader = csv.reader(f)
                      header = next(reader, None)
                      if header and len(header) != 3:
                          warnings.append(f'{csv_file.name}: expected 3 columns, got {len(header)}')
                      rows = sum(1 for _ in reader)
                      print(f'  {csv_file.name}: {rows} rows')
              except Exception as e:
                  errors.append(f'{csv_file.name}: {e}')
          if warnings:
              print('WARNINGS (non-fatal, pre-existing data issues):')
              for w in warnings:
                  print(f'  ⚠ {w}')
          if errors:
              print('ERRORS:')
              for e in errors:
                  print(f'  ❌ {e}')
              exit(1)
          print('All CSV files readable ✅')
          "

      - name: Check for hardcoded paths
        run: |
          # Only fail on hardcoded paths in the patched files (convert_dicts.py + ocr_pdf_ar1.py)
          # Other scripts may still contain them — to be fixed in a separate PR.
          HITS=0
          for f in scripts/convert_dicts.py scripts/ocr_pdf_ar1.py; do
            if grep -E '/home/z/my-project/dict_work' "$f" 2>/dev/null; then
              echo "❌ Hardcoded path in $f"
              HITS=1
            fi
          done
          if [ "$HITS" -ne 0 ]; then exit 1; fi
          echo "✅ Patched files have no hardcoded paths"
